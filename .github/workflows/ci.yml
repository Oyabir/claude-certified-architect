# Intégration continue PC Santé : compilation Release (zéro avertissement) et tests automatisés.
# La solution compile sous Linux grâce à EnableWindowsTargeting ; l'installeur WiX (Windows uniquement) n'est pas construit ici.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restauration
        run: dotnet restore PcSante.sln

      - name: Compilation Release (avertissements = erreurs)
        run: dotnet build PcSante.sln -c Release --no-restore

      - name: Tests
        run: >
          dotnet test PcSante.sln -c Release --no-build
          --logger "trx;LogFilePrefix=results"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Résultats et couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: TestResults
          if-no-files-found: ignore
